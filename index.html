<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GridLab</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="cabecalho">
        <h1>GridLab</h1>
        <p>Laboratório de CSS Grid</p>
    </header>

    <main class="conteudo">

        <section class="experimento">

            <h2>Área de experimentação</h2>

            <p class="instrucao">
                Modifique as propriedades do grid container
                e observe o comportamento dos elementos.
            </p>

            <div class="container">

                <div class="item item-1">1</div>
                <div class="item item-2">2</div>
                <div class="item item-3">3</div>
                <div class="item item-4">4</div>
                <div class="item item-5">5</div>
                <div class="item item-6">6</div>

            </div>

        </section>

        <section class="layout">

            <header class="layout-cabecalho">
                Cabeçalho
                <div class="acoes-layout">
                    <button type="button">Editar</button>
                    <button type="button">Salvar</button>
                </div>
            </header>

            <aside class="layout-menu">
                Menu
            </aside>

            <main class="layout-principal">
                Conteúdo principal
            </main>

            <footer class="layout-rodape">
                Rodapé
            </footer>

        </section>

    </main>

</body>

</html>
